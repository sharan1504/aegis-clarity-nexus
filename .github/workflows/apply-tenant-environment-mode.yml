name: Apply tenant environment mode refactor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  backend-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply backend refactor
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          marker = Path('.env-mode-backend-done')
          if marker.exists(): raise SystemExit(0)

          def add_import(text):
              if 'from "@/lib/tenant-context.server"' in text: return text
              lines = text.splitlines(); idx = max([i for i, line in enumerate(lines) if line.startswith('import ')] or [-1]) + 1
              lines.insert(idx, 'import { resolveTenantContext } from "@/lib/tenant-context.server";')
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          handler_files = ['src/lib/enterprise-chat.functions.ts','src/lib/chat-history.functions.ts','src/lib/agent-workflow.functions.ts','src/lib/report-workspace.functions.ts','src/lib/agent-deployment.functions.ts','src/lib/customer-investigation.functions.ts','src/lib/analytics.functions.ts','src/lib/users.functions.ts']
          for name in handler_files:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if 'DEMO_DATA_ENABLED' not in text: continue
              text=re.sub(r'\bDEMO_DATA_ENABLED,\s*','',text); text=re.sub(r',\s*DEMO_DATA_ENABLED\b','',text); text=add_import(text)
              if 'const { environmentMode } = await resolveTenantContext' not in text:
                  m=re.search(r'(handler\(async \(\{ (?:data, )?context \}\) => \{)',text)
                  if not m: raise SystemExit(f'No handler context anchor in {name}')
                  text=text[:m.end()]+'\n  const { environmentMode } = await resolveTenantContext(context.supabase, context.userId);'+text[m.end():]
              text=text.replace('DEMO_DATA_ENABLED','environmentMode === "demo"'); p.write_text(text,encoding='utf-8')

          helper_files=['src/lib/agent-detail.server.ts','src/lib/investigation.server.ts','src/lib/live-workspace.functions.ts','src/lib/command-center.server.ts']
          for name in helper_files:
              p=Path(name); text=p.read_text(encoding='utf-8')
              if 'DEMO_DATA_ENABLED' not in text: continue
              text=re.sub(r'\bDEMO_DATA_ENABLED,\s*','',text); text=re.sub(r',\s*DEMO_DATA_ENABLED\b','',text); text=add_import(text)
              matches=list(re.finditer(r'export async function [^(]+\([^)]*userId: string[^)]*\)[^{]*\{',text)); offset=0
              for m in matches:
                  at=m.end()+offset; end=text.find('\nexport ',at); end=len(text) if end==-1 else end; segment=text[at:end]
                  if 'DEMO_DATA_ENABLED' in segment:
                      ins='\n  const { environmentMode } = await resolveTenantContext(supabase, userId);'; text=text[:at]+ins+text[at:]; offset+=len(ins)
              text=text.replace('DEMO_DATA_ENABLED','environmentMode === "demo"'); p.write_text(text,encoding='utf-8')

          p=Path('src/lib/change-service.ts'); text=p.read_text(encoding='utf-8')
          text=text.replace('import { DEMO_DATA_ENABLED } from "@/lib/demo-data";',''); text=add_import(text)
          text=text.replace('interface ActorContext { tenantId: string; actor: string; role: string; }','interface ActorContext { tenantId: string; actor: string; role: string; userId: string; }')
          text=text.replace('export async function decideChange(record: ChangeRecord, decision: "approved" | "rejected", ctx: ActorContext, comment?: string) {','export async function decideChange(record: ChangeRecord, decision: "approved" | "rejected", ctx: ActorContext, comment?: string) {\n  const { environmentMode } = await resolveTenantContext(supabase, ctx.userId);')
          text=text.replace('DEMO_DATA_ENABLED','environmentMode === "demo"'); p.write_text(text,encoding='utf-8')

          for name in ['src/routes/_app.approvals.index.tsx','src/routes/_app.approvals.$id.tsx']:
              p=Path(name); text=p.read_text(encoding='utf-8'); text=text.replace('tenantId, actor: user?.email ?? "unknown", role','tenantId, actor: user?.email ?? "unknown", role, userId: user?.id ?? ""'); p.write_text(text,encoding='utf-8')

          p=Path('src/lib/change-service.test.ts'); text=p.read_text(encoding='utf-8')
          text=re.sub(r'vi\.mock\("@/lib/demo-data", \(\) => \(\{ DEMO_DATA_ENABLED: false \}\)\);\n\n?','',text)
          if 'vi.mock("@/lib/tenant-context.server"' not in text: text=text.replace('vi.mock("@/integrations/supabase/client"','vi.mock("@/lib/tenant-context.server", () => ({ resolveTenantContext: vi.fn().mockResolvedValue({ environmentMode: "live" }) }));\n\nvi.mock("@/integrations/supabase/client"',1)
          text=text.replace('const actor = { tenantId: "tenant-1", actor: "Admin", role: "admin" };','const actor = { tenantId: "tenant-1", actor: "Admin", role: "admin", userId: "test-user" };'); p.write_text(text,encoding='utf-8')
          p=Path('src/lib/change-service.demo.test.ts')
          if p.exists():
              text=p.read_text(encoding='utf-8'); text=text.replace('const actor = { tenantId: "tenant-1", actor: "Admin", role: "admin" };','const actor = { tenantId: "tenant-1", actor: "Admin", role: "admin", userId: "demo-user" };')
              if 'vi.mock("@/lib/tenant-context.server"' not in text:
                  text='vi.mock("@/lib/tenant-context.server", () => ({ resolveTenantContext: vi.fn().mockResolvedValue({ environmentMode: "demo" }) }));\n\n'+text
              p.write_text(text,encoding='utf-8')

          p=Path('src/lib/realtime.ts'); text=p.read_text(encoding='utf-8')
          text=text.replace('import { DEMO_CHANGES, DEMO_DATA_ENABLED } from "@/lib/demo-data";','import { DEMO_CHANGES } from "@/lib/demo-data";')
          text=text.replace('export interface RealtimeState { records:','export interface RealtimeState { environmentMode: "live" | "demo"; records:',1)
          text=text.replace('const initialState: RealtimeState = { records:','const initialState: RealtimeState = { environmentMode: "live", records:',1)
          text=text.replace('async function loadAll(tenantId:string){if(DEMO_DATA_ENABLED)','async function loadAll(tenantId:string){if(state.environmentMode === "demo")')
          text=text.replace('export function initRealtime(tenantId:string){','export function initRealtime(tenantId:string, environmentMode: "live" | "demo"){')
          text=text.replace('activeTenant=tenantId;setState({loading:true,tenantId});void loadAll(tenantId);if(DEMO_DATA_ENABLED)','activeTenant=tenantId;setState({loading:true,tenantId,environmentMode});void loadAll(tenantId);if(environmentMode === "demo")')
          text=text.replace('if(DEMO_DATA_ENABLED){setState({notifications:','if(state.environmentMode === "demo"){setState({notifications:')
          text=text.replace('if(!DEMO_DATA_ENABLED)await supabase.from("notifications")','if(state.environmentMode !== "demo")await supabase.from("notifications")')
          text=text.replace('if(!DEMO_DATA_ENABLED&&ids.length)','if(state.environmentMode !== "demo"&&ids.length)')
          p.write_text(text,encoding='utf-8')

          marker.write_text('done\n',encoding='utf-8')
          PY
      - name: Commit backend refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .env-mode-backend-done
          git commit -m "env: refactor demo call sites to tenant mode [env-mode-backend]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
