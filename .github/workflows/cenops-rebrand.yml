name: Cenops Rebrand

on:
  push:
    branches:
      - chore/cenops-rebrand

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace customer-facing Aegis branding
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("src")
          protected_lower = {"aegis-theme", "aegis-operations-hub"}
          changed = []

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".ts", ".tsx", ".js", ".jsx", ".css", ".md"}:
                  continue
              text = path.read_text(encoding="utf-8")
              original = text

              # Customer-visible/product copy.
              text = text.replace("Aegis AI", "Cenops")
              text = re.sub(r"(?<![A-Za-z0-9_])Aegis(?![A-Za-z0-9_])", "Cenops", text)

              # Restore deliberate internal compatibility identifiers.
              text = text.replace("aegis-operations-hub", "aegis-operations-hub")
              text = text.replace('localStorage.getItem("Cenops-theme")', 'localStorage.getItem("aegis-theme")')
              text = text.replace('localStorage.setItem("Cenops-theme"', 'localStorage.setItem("aegis-theme"')
              text = text.replace('localStorage.removeItem("Cenops-theme")', 'localStorage.removeItem("aegis-theme")')
              text = re.sub(r"\bAEGIS_[A-Z0-9_]+\b", lambda m: m.group(0), text)

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print(f"Updated {len(changed)} source files")
          for item in changed:
              print(item)

      - name: Validate protected identifiers and Command Center fix
        shell: bash
        run: |
          grep -Rni --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.output 'aegis-theme\|aegis-operations-hub\|AEGIS_' src >/tmp/protected.txt || true
          test -s /tmp/protected.txt
          grep -q 'buildEmptyLiveCommandCenterData' src/lib/command-center.server.ts
          grep -q 'if (!integrationSeed?.length) return buildEmptyLiveCommandCenterData();' src/lib/command-center.server.ts
          if grep -Rni --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.output -E '"Built with Lovable"|>Built with Lovable<' src; then
            echo 'App-controlled Lovable branding found in src'
            exit 1
          fi

      - name: Verify no customer-facing Aegis remains
        shell: bash
        run: |
          if grep -Rni --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.output -E 'Aegis( AI)?' src | grep -viE 'AEGIS_|aegis-theme|aegis-operations-hub'; then
            echo 'Unexpected Aegis branding remains in src'
            exit 1
          fi

      - name: Lint
        run: npm ci --no-audit --no-fund && npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Commit rebrand and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: rename customer-facing Aegis branding to Cenops" || true
          git push
