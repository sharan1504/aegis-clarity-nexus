name: Aegis CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Upgrade npm
        run: npm install --global npm@11.19.1
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync."
            exit 0
          fi
          cp package-lock.json "$RUNNER_TEMP/package-lock.json"
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          cp "$RUNNER_TEMP/package-lock.json" package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build

  migrate:
    name: Apply Supabase migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Supabase migration credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is not configured. Refusing to continue without production migration credentials." >&2
            exit 1
          fi
          if [[ -z "${SUPABASE_PROJECT_REF:-}" ]]; then
            echo "ERROR: SUPABASE_PROJECT_REF is not configured. Refusing to continue without a production project target." >&2
            exit 1
          fi
          if [[ "$SUPABASE_PROJECT_REF" != "zvvtvhocznuemcshkdla" ]]; then
            echo "ERROR: SUPABASE_PROJECT_REF does not match the verified production project ref." >&2
            exit 1
          fi
          echo "Supabase migration credentials and production project target are configured."

      - name: Show migration plan
        run: npx --yes supabase@latest migration list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dry-run all unapplied migrations
        run: npx --yes supabase@latest db push --project-ref "$SUPABASE_PROJECT_REF" --include-all --dry-run

      - name: Apply all unapplied migrations
        run: npx --yes supabase@latest db push --project-ref "$SUPABASE_PROJECT_REF" --include-all

      - name: Verify migration state
        run: npx --yes supabase@latest migration list --project-ref "$SUPABASE_PROJECT_REF"
