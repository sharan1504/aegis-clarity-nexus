name: Finish environment mode
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply and validate environment mode
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('src/routes/_app.chat.tsx'); s=p.read_text(); s=s.replace('import { DEMO_DATA_ENABLED } from "@/lib/demo-data";\n',''); s=s.replace('const { tenantId, user } = useTenantContext();','const { tenantId, user, environmentMode } = useTenantContext();'); s=s.replace('const isDemoData = latestAssistantResult?.demo ?? DEMO_DATA_ENABLED;','const isDemoData = environmentMode === "demo"'); p.write_text(s)
          p=Path('src/routes/_app.investigations.tsx'); s=p.read_text(); s=s.replace('import { pageHead } from "@/lib/seo";','import { useTenantContext } from "@/lib/tenant";\nimport { pageHead } from "@/lib/seo";',1) if 'useTenantContext' not in s else s; s=s.replace('function VulnerabilitiesPage() { const { key } = Route.useSearch();','function VulnerabilitiesPage() { const { key } = Route.useSearch(); const { environmentMode } = useTenantContext();'); s=s.replace('items.isDemo ? "Seeded demo records · no provider mutation" : "Evidence-backed · no synthetic findings"','environmentMode === "demo" ? "Seeded demo records · no provider mutation" : "Evidence-backed · no synthetic findings"'); s=s.replace('data.isDemo && <Badge variant="outline" className="border-primary/40 text-primary">Demo data</Badge>','environmentMode === "demo" && <Badge variant="outline" className="border-primary/40 text-primary">Demo data</Badge>'); p.write_text(s)
          p=Path('src/routes/_app.approvals.index.tsx'); s=p.read_text(); s=s.replace('const { tenantId, user } = useTenantContext();','const { tenantId, user, environmentMode } = useTenantContext();'); s=s.replace('const demoRecords = records.length > 0 && records.every((record) => record.demo);','const demoRecords = environmentMode === "demo"'); p.write_text(s)
          # Audit repository is a per-request facade, not a module-level demo selection.
          p=Path('src/lib/audit/repository.ts'); s=p.read_text();
          if 'DEMO_DATA_ENABLED' in s:
              s=s.replace('import { DEMO_DATA_ENABLED } from "@/lib/demo-data";','import { resolveTenantContext } from "@/lib/tenant-context.server";'); old='export const auditRepository: AuditRepository = DEMO_DATA_ENABLED ? demoAuditRepository : new SupabaseAuditRepository();'; new='''async function resolveAuditRepository(): Promise<AuditRepository> {\n  const { data: auth } = await supabase.auth.getUser();\n  if (!auth.user) return new SupabaseAuditRepository();\n  const { environmentMode } = await resolveTenantContext(supabase, auth.user.id);\n  return environmentMode === "demo" ? demoAuditRepository : new SupabaseAuditRepository();\n}\n\nexport const auditRepository: AuditRepository = {\n  async list(filters, ctx) { return (await resolveAuditRepository()).list(filters, ctx); },\n  async get(id, ctx) { return (await resolveAuditRepository()).get(id, ctx); },\n  async related(id, ctx) { return (await resolveAuditRepository()).related(id, ctx); },\n  async stats(filters, ctx) { return (await resolveAuditRepository()).stats(filters, ctx); },\n  async record(event) { return (await resolveAuditRepository()).record(event); },\n};''';
              if old not in s: raise SystemExit('audit repository selection anchor missing')
              s=s.replace(old,new,1); p.write_text(s)
          # Static live safety guard for every source file that used the old global flag.
          files=['src/lib/enterprise-chat.functions.ts','src/lib/change-service.ts','src/lib/chat-history.functions.ts','src/lib/agent-workflow.functions.ts','src/lib/change-proposal.server.ts','src/lib/report-workspace.functions.ts','src/lib/agent-deployment.functions.ts','src/lib/customer-investigation.functions.ts','src/lib/agent-detail.server.ts','src/lib/command-center.server.ts','src/lib/analytics.functions.ts','src/lib/live-workspace.functions.ts','src/lib/investigation.server.ts','src/lib/users.functions.ts','src/lib/realtime.ts','src/routes/_app.chat.tsx']
          leftovers=[f for f in files if 'DEMO_DATA_ENABLED' in Path(f).read_text()]
          if leftovers: raise SystemExit('DEMO_DATA_ENABLED remains: '+', '.join(leftovers))
          PY
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "env: finish tenant Live Demo runtime toggle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
