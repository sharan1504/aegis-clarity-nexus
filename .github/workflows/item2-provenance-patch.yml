name: Apply Item 2 provenance fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != '2: make demo data provenance explicit in summary badges'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply exact UI provenance patches
        run: |
          node <<'NODE'
          const fs = require('fs');
          function patch(path, replacements) {
            let text = fs.readFileSync(path, 'utf8');
            for (const [from, to] of replacements) {
              if (!text.includes(from)) throw new Error(`Pattern not found in ${path}: ${from}`);
              text = text.replace(from, to);
            }
            fs.writeFileSync(path, text);
          }
          patch('src/routes/_app.chat.tsx', [
            ['import { createChangeFromRecommendation } from "@/lib/change-recommendation.functions";\n', 'import { createChangeFromRecommendation } from "@/lib/change-recommendation.functions";\nimport { DEMO_DATA_ENABLED } from "@/lib/demo-data";\n'],
            ['type Result = { answer?: string;', 'type Result = { demo?: boolean; answer?: string;'],
            ['const activeDepartmentName = departments.find((item) => item.department_key === departmentKey)?.display_name ?? (unrestricted ? "Workspace-wide" : "Department");\n  return <div className="flex h-[calc(100vh-7rem)] flex-col">', 'const activeDepartmentName = departments.find((item) => item.department_key === departmentKey)?.display_name ?? (unrestricted ? "Workspace-wide" : "Department");\n  const latestAssistantResult = [...messages].reverse().find((message) => message.role === "assistant" && message.result)?.result;\n  const isDemoData = latestAssistantResult?.demo ?? DEMO_DATA_ENABLED;\n  return <div className="flex h-[calc(100vh-7rem)] flex-col">'],
            ['<Badge variant="outline" className="gap-1.5 border-success/40 text-success"><span className="h-1.5 w-1.5 rounded-full bg-success" /> Live data</Badge>', '<Badge variant="outline" className={`gap-1.5 ${isDemoData ? "border-primary/40 text-primary" : "border-success/40 text-success"}`}><span className={`h-1.5 w-1.5 rounded-full ${isDemoData ? "bg-primary" : "bg-success"}`} /> {isDemoData ? "Demo data" : "Live data"}</Badge>']
          ]);
          patch('src/routes/_app.investigations.tsx', [
            ['<span className="text-xs text-muted-foreground">Evidence-backed · no synthetic findings</span>', '<span className="text-xs text-muted-foreground">{items.isDemo ? "Seeded demo records · no provider mutation" : "Evidence-backed · no synthetic findings"}</span>'],
            ['<Badge variant="outline">Confidence: {data.confidence}</Badge>', '<Badge variant="outline">Confidence: {data.confidence}</Badge>{data.isDemo && <Badge variant="outline" className="border-primary/40 text-primary">Demo data</Badge>}']
          ]);
          patch('src/routes/_app.approvals.index.tsx', [
            ['  const teams = useMemo(() => Array.from(new Set(records.map((r) => r.ownerTeam))).sort(), [records]);', '  const demoRecords = records.length > 0 && records.every((record) => record.demo);\n  const dataSourceLabel = demoRecords ? "Demo" : connected ? "Live" : "Offline";\n  const teams = useMemo(() => Array.from(new Set(records.map((r) => r.ownerTeam))).sort(), [records]);'],
            ['<PageHeader title="Approval Center" description="Live change records only. Approval records intent; execution requires a write-capable connected integration."', '<PageHeader title="Approval Center" description={demoRecords ? "Seeded demo change records. Approval interactions are simulated and never mutate a provider." : "Live change records only. Approval records intent; execution requires a write-capable connected integration."}'],
            ['<div className="ml-auto flex items-center gap-3 text-xs text-muted-foreground"><span className={`h-1.5 w-1.5 rounded-full ${connected ? "bg-success animate-pulse" : "bg-muted-foreground"}`} />{connected ? "Live" : "Offline"}{lastEventAt ? ` · ${new Date(lastEventAt).toLocaleTimeString()}` : ""}<span>{filtered.length} records</span></div>', '<div className="ml-auto flex items-center gap-3 text-xs text-muted-foreground"><span className={`h-1.5 w-1.5 rounded-full ${demoRecords ? "bg-primary" : connected ? "bg-success animate-pulse" : "bg-muted-foreground"}`} />{dataSourceLabel}{lastEventAt ? ` · ${new Date(lastEventAt).toLocaleTimeString()}` : ""}<span>{filtered.length} records</span></div>'],
            ['<div className="font-medium">No live approval records</div><div className="mt-1 text-sm text-muted-foreground">Create an approval from a live dashboard recommendation. Seeded/demo changes are intentionally hidden.</div>', '<div className="font-medium">{demoRecords ? "No demo approval records match your filters" : "No live approval records"}</div><div className="mt-1 text-sm text-muted-foreground">{demoRecords ? "Seeded demo changes are available for workflow evaluation and do not mutate connected providers." : "Create an approval from a live dashboard recommendation."}</div>']
          ]);
          NODE
      - name: Validate
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit item 2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/item2-provenance-patch.yml
          git add src/routes/_app.chat.tsx src/routes/_app.investigations.tsx src/routes/_app.approvals.index.tsx
          git commit -m "2: make demo data provenance explicit in summary badges"
          git push origin main
