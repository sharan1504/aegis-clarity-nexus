name: Fix nested route rendering

on:
  push:
    branches:
      - fix/nested-route-rendering-20260914

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply nested route fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def wrap_parent(path, start, boundary):
              p = Path(path)
              s = p.read_text()
              s = s.replace('import { createFileRoute, Link } from "@tanstack/react-router";', 'import { createFileRoute, Link, Outlet, useRouterState } from "@tanstack/react-router";', 1)
              s = re.sub(r'import \{ AgenticGovernancePage \} from "\./_app\.agentic-studio\.governance";\n?', '', s, count=1)
              s = re.sub(r'\n  const governanceView = .*?;\n', '\n', s, count=1)
              s = re.sub(r'\n  if \(governanceView\) return <AgenticGovernancePage />;\n', '\n', s, count=1)
              if 'const pathname = useRouterState' not in s:
                  marker = '  const availableTools = tools.filter((tool) => tool.available); const blockedTools = tools.filter((tool) => !tool.available);\n'
                  if marker in s:
                      s = s.replace(marker, marker + '  const pathname = useRouterState({ select: (r) => r.location.pathname });\n', 1)
                  else:
                      marker = '  const [selectedDepartmentId, setSelectedDepartmentId] = useState<string>("");\n'
                      if marker not in s: raise SystemExit(f'{path}: state marker not found')
                      s = s.replace(marker, marker + '  const pathname = useRouterState({ select: (r) => r.location.pathname });\n', 1)
              if '<Outlet />' not in s:
                  s = s.replace(start, start.replace('return ', 'return <><Outlet />{pathname === "/agentic-studio" && <div className="space-y-6">' if 'agentic-studio' in start else 'return <><Outlet />{pathname === "/settings" && <div><PageHeader title="Settings"'), 1)
              if 'agentic-studio' in path:
                  s = s.replace('  return <div className="space-y-6">', '  return <><Outlet />{pathname === "/agentic-studio" && <div className="space-y-6">', 1)
              else:
                  s = s.replace('  return <div><PageHeader title="Settings"', '  return <><Outlet />{pathname === "/settings" && <div><PageHeader title="Settings"', 1)
              idx = s.find(boundary)
              if idx < 0: raise SystemExit(f'{path}: component boundary not found')
              before, after = s[:idx], s[idx:]
              fixed, count = re.subn(r'\n  </div>;\n}$', '\n  </div>}\n  </>;\n}', before, count=1)
              if count != 1: raise SystemExit(f'{path}: return closing pattern not found')
              p.write_text(fixed + after)

          wrap_parent('src/routes/_app.agentic-studio.tsx', '  return <div className="space-y-6">', '\nfunction ArchitectView')
          wrap_parent('src/routes/_app.settings.tsx', '  return <div><PageHeader title="Settings"', '\nfunction Field')

          sidebar = Path('src/components/layout/AppSidebar.tsx')
          s = sidebar.read_text()
          old = '  const isActive = (url: string) => url === "/" ? path === "/" : path.startsWith(url);'
          new = '  const isActive = (url: string) => url === "/" ? path === "/" : (url === "/agentic-studio" || url === "/settings" ? path === url : path.startsWith(url));'
          if old in s: s = s.replace(old, new, 1)
          sidebar.write_text(s)
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_app.agentic-studio.tsx src/routes/_app.settings.tsx src/components/layout/AppSidebar.tsx package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: render nested governance and ITSM routes"
          git push
